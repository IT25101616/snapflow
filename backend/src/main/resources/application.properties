# SnapFlow Application Properties
spring.application.name=snapflow-backend
server.port=8080
server.servlet.context-path=/api

spring.profiles.active=dev

# Load DB_USERNAME / DB_PASSWORD / DB_URL from a local .env file if one exists.
# Spring Boot does NOT read .env files by itself. The two paths cover running the
# backend from the repo root (./.env) or from the backend folder (../.env).
# Real environment variables and IntelliJ "Environment variables" still win.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# File Storage Configuration
file.upload-dir=${UPLOAD_DIR:./uploads}

# JWT Configuration
snapflow.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
snapflow.jwt.expiration-ms=86400000

# Multipart Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# SpringDoc OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
